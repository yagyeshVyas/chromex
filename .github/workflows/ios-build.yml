name: iOS unsigned build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle identifier for this build"
        required: false
        default: "com.chromex.browser"

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CHROMEX (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ inputs.bundle_id || 'com.chromex.browser' }}
      SCHEME: CHROMEX

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          echo "bundle id: $BUNDLE_ID"

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "marketing=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=1.0.0" >> "$GITHUB_OUTPUT"
          fi
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version: $(cat "$GITHUB_OUTPUT" | tr '\n' ' ')"

      - name: Show build settings (signing must be off)
        run: |
          xcodebuild -project CHROMEX.xcodeproj -scheme "$SCHEME" -showBuildSettings \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGNING_ALLOWED|CODE_SIGNING_REQUIRED|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM' || true

      - name: Build for iphoneos without code signing
        run: |
          set -o pipefail
          xcodebuild \
            -project CHROMEX.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log

      - name: Generate extension fixtures
        run: python3 Scripts/make_fixtures.py

      - name: Run Linux QA harness (analysis + benchmarks)
        run: bash Scripts/qa-linux.sh

      - name: Upload QA reports
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: QA/reports
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests
        run: |
          set -o pipefail
          DESTINATION_NAME="$(xcrun simctl list devices available \
            | grep -E '^[[:space:]]+iPhone' \
            | head -1 \
            | sed -E 's/^[[:space:]]+//; s/ \(.*$//')"
          if [ -z "$DESTINATION_NAME" ]; then
            DESTINATION_NAME="iPhone 16"
          fi
          echo "Testing on: $DESTINATION_NAME"
          xcodebuild test \
            -project CHROMEX.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$DESTINATION_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee tests.log

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/CHROMEX.app"
          bash Scripts/package_ipa.sh "$APP" CHROMEX-unsigned.ipa

      - name: Verify the archive is genuinely unsigned
        run: bash Scripts/verify_ipa.sh CHROMEX-unsigned.ipa

      - name: Prove it can be signed and re-identified independently
        run: |
          set -euo pipefail
          BEFORE="$(shasum -a 256 CHROMEX-unsigned.ipa | awk '{print $1}')"

          WORK="$(mktemp -d)"
          unzip -q CHROMEX-unsigned.ipa -d "$WORK"
          APP="$WORK/Payload/CHROMEX.app"

          # Ad-hoc signature: no certificate, no profile. It proves the bundle is
          # structurally signable and that no stale signature blocks re-signing.
          codesign --force --sign - --generate-entitlement-der "$APP"
          codesign --verify --deep --strict --verbose=1 "$APP"
          echo "ad-hoc signing verified"

          # Identifier rewrite must work on the downloaded artifact.
          cp CHROMEX-unsigned.ipa "$WORK/probe.ipa"
          bash Scripts/set_bundle_id.sh "$WORK/probe.ipa" com.chromex.signingprobe
          unzip -p "$WORK/probe-com-chromex-signingprobe.ipa" Payload/CHROMEX.app/Info.plist > "$WORK/probe.plist"
          plutil -lint "$WORK/probe.plist" >/dev/null
          ID="$(plutil -extract CFBundleIdentifier raw "$WORK/probe.plist")"
          [ "$ID" = "com.chromex.signingprobe" ] || { echo "identifier rewrite failed: $ID" >&2; exit 1; }
          echo "identifier rewrite verified: $ID"

          AFTER="$(shasum -a 256 CHROMEX-unsigned.ipa | awk '{print $1}')"
          [ "$BEFORE" = "$AFTER" ] || { echo "published IPA was mutated by the probe" >&2; exit 1; }
          rm -rf "$WORK"
          echo "published artifact is unchanged"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CHROMEX-unsigned-ipa
          path: CHROMEX-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            tests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" CHROMEX-unsigned.ipa \
            --title "CHROMEX $GITHUB_REF_NAME â€” unsigned IPA" \
            --notes "Certificate-independent unsigned IPA. It contains no signing identity, no provisioning profile and no developer entitlements. Sign it yourself â€” see SIGNING-GUIDE.md." \
            --generate-notes \
            --latest

